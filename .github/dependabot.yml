version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app/backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app/frontend
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cluster
    schedule:
      interval: weekly
