name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: restaurant-aid
  NAMESPACE: restaurant-aid

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff (backend)
        run: |
          pip install ruff
          ruff check app/backend

      - uses: hashicorp/setup-terraform@v3


      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:latest -strict -summary /k8s

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest test_main.py -v

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [lint, backend-tests]
    permissions:

      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t restaurant-aid-backend:ci ./app/backend
          docker build --build-arg VITE_API_URL="${{ vars.API_URL }}" -t restaurant-aid-frontend:ci ./app/frontend

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          for image in restaurant-aid-backend:ci restaurant-aid-frontend:ci; do
            echo "==> Scanning $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --no-progress --scanners vuln \
              --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "$image"
          done

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      - name: Push scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sha="${GITHUB_SHA::7}"
          for svc in backend frontend; do
            image="$REGISTRY/restaurant-aid-$svc:$sha"
            existing=$(aws ecr batch-get-image --repository-name "restaurant-aid-$svc" --image-ids imageTag="$sha" --query 'images[0].imageId.imageTag' --output text)
            if [ "$existing" = "$sha" ]; then
              echo "$image already exists, skipping push"
            else
              docker tag "restaurant-aid-$svc:ci" "$image"
              docker push "$image"
            fi
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Roll out new images
        id: rollout
        run: |
          sha="${GITHUB_SHA::7}"
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          kubectl -n "$NAMESPACE" set image deployment/backend backend="$registry/restaurant-aid-backend:$sha"
          kubectl -n "$NAMESPACE" set image deployment/frontend frontend="$registry/restaurant-aid-frontend:$sha"
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=180s

      - name: Roll back on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/backend
          kubectl -n "$NAMESPACE" rollout undo deployment/frontend
