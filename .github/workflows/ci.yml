name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: restaurant-aid
  NAMESPACE: restaurant-aid

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff (backend)
        run: |
          pip install ruff
          ruff check app/backend

      - uses: hashicorp/setup-terraform@v3


      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:latest -strict -summary /k8s

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest test_main.py -v

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [lint, backend-tests]
    permissions:

      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t restaurant-aid-backend:ci ./app/backend
          docker build --build-arg VITE_API_URL="${{ vars.API_URL }}" -t restaurant-aid-frontend:ci ./app/frontend

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          for image in restaurant-aid-backend:ci restaurant-aid-frontend:ci; do
            echo "==> Scanning $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --no-progress --scanners vuln \
              --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "$image"
          done

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      - name: Push scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sha="${GITHUB_SHA::7}"
          for svc in backend frontend; do
            image="$REGISTRY/restaurant-aid-$svc:$sha"
            existing=$(aws ecr batch-get-image --repository-name "restaurant-aid-$svc" --image-ids imageTag="$sha" --query 'images[0].imageId.imageTag' --output text)
            if [ "$existing" = "$sha" ]; then
              echo "$image already exists, skipping push"
            else
              docker tag "restaurant-aid-$svc:ci" "$image"
              docker push "$image"
            fi
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Record images currently running
        id: prev
        run: |
          echo "backend=$(kubectl -n "$NAMESPACE" get deploy backend -o jsonpath='{.spec.template.spec.containers[0].image}')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(kubectl -n "$NAMESPACE" get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}')" >> "$GITHUB_OUTPUT"


      - name: Render manifests with this commit's image tag
        run: |
          sha="${GITHUB_SHA::7}"
          mkdir -p rendered
          for f in backend frontend availability; do
            sed -E "s#(restaurant-aid-(backend|frontend)):[A-Za-z0-9._-]+#\1:${sha}#" "k8s/$f.yaml" > "rendered/$f.yaml"
          done
          grep -h "image:" rendered/*.yaml

      - name: Validate against the cluster (server dry run)
        run: kubectl apply --dry-run=server -f rendered/availability.yaml -f rendered/backend.yaml -f rendered/frontend.yaml -f k8s/monitoring/

      - name: Apply manifests and wait for rollout
        id: rollout
        run: |
          kubectl apply -f rendered/availability.yaml
          kubectl apply -f rendered/backend.yaml
          kubectl apply -f rendered/frontend.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=240s

      - name: Deploy monitoring (Prometheus and Grafana)
        run: |
          kubectl -n "$NAMESPACE" create configmap grafana-dashboards --from-file=restaurant-aid.json=observability/dashboard.json --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/monitoring/
          kubectl -n "$NAMESPACE" rollout status deployment/prometheus --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/grafana --timeout=180s

      - name: Restore previous images on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          kubectl -n "$NAMESPACE" set image deployment/backend backend="${{ steps.prev.outputs.backend }}"
          kubectl -n "$NAMESPACE" set image deployment/frontend frontend="${{ steps.prev.outputs.frontend }}"
