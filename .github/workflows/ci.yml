name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest test_main.py -v

  build-images:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env file for compose validation
        run: |
          echo "SECRET_KEY=ci-only-not-a-real-secret" > .env
          echo "POSTGRES_PASSWORD=ci-only-not-a-real-password" >> .env

      - name: Build images
        run: docker compose build

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          for image in restaurant-aid-app-backend restaurant-aid-app-frontend; do
            echo "==> Scanning $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --no-progress --scanners vuln \
              --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "$image"
          done

  publish:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sha="${GITHUB_SHA::7}"
          for svc in backend frontend; do
            image="$REGISTRY/restaurant-aid-$svc:$sha"
            docker build -t "$image" "./app/$svc"
            docker push "$image"
          done