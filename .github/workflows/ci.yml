name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest test_main.py -v

          build-images:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env file for compose validation
        run: |
          echo "SECRET_KEY=ci-only-not-a-real-secret" > .env
          echo "POSTGRES_PASSWORD=ci-only-not-a-real-password" >> .env

      - name: Build images
        run: docker compose build

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: restaurant-aid-backend:latest
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: restaurant-aid-frontend:latest
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"