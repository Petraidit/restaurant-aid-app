name: App CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - "observability/**"
      - "scripts/ci/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "k8s/**"
      - "observability/**"
      - "scripts/ci/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: restaurant-aid-tf
  NAMESPACE: restaurant-aid


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ruff (backend)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.10"
          src: app/backend

      - name: ShellCheck (CI scripts)
        run: shellcheck scripts/ci/*.sh

      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          args: -strict -summary k8s

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -v

  build-scan-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the API_URL variable
        run: bash scripts/ci/build.sh check-api-url

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the backend image

        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app/backend
          load: true
          provenance: false
          tags: restaurant-aid-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app/frontend
          load: true
          provenance: false
          tags: restaurant-aid-frontend:ci
          build-args: VITE_API_URL=${{ vars.API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan the backend image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: restaurant-aid-backend:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the frontend image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:

          image-ref: restaurant-aid-frontend:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials (push role)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the scanned images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash scripts/ci/build.sh push-images

  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:

      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.9

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Record the images currently running
        id: previous
        run: bash scripts/ci/deploy.sh record-images

      - name: Render manifests with this commit's image tag
        run: bash scripts/ci/deploy.sh render

      - name: Validate against the cluster (server dry run)
        run: bash scripts/ci/deploy.sh dry-run

      - name: Apply the app manifests and wait for the rollout
        id: rollout

        run: bash scripts/ci/deploy.sh apply

      - name: Deploy monitoring (Prometheus and Grafana)
        run: bash scripts/ci/deploy.sh monitoring

      - name: Verify the frontend points at this cluster's backend
        run: bash scripts/ci/deploy.sh verify-frontend

      - name: Restore the previous images on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        env:
          PREVIOUS_BACKEND: ${{ steps.previous.outputs.backend }}
          PREVIOUS_FRONTEND: ${{ steps.previous.outputs.frontend }}
        run: bash scripts/ci/deploy.sh restore
